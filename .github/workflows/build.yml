
name: Build PushWake unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build PushWake for iPhone
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'

      - name: Verify Xcode and SDK
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -showsdks
          SDK="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $SDK"
          [[ "$SDK" == 26.* ]] || exit 1

      - name: Build PushWake
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project PushWake.xcodeproj \
            -scheme PushWake \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/PushWakeBuild" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/PushWakeBuild/Build/Products/Release-iphoneos/PushWake.app"
          test -d "$APP"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"

          cd "$RUNNER_TEMP/ipa"
          zip -q -r "$GITHUB_WORKSPACE/PushWake-unsigned.ipa" Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PushWake-unsigned-ipa
          path: PushWake-unsigned.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PushWake-build-logs
          path: ${{ runner.temp }}/build.log
          retention-days: 7
          if-no-files-found: ignore
